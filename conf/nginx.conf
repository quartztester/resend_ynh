# Quicklink: local landing page auto-forwards to the external service.
# Served as a real page (not a bare 302) so the URL stays valid behind the
# SSO portal and CI's redirect-following curl gets a 200 from this host.
location = __PATH__ {
    #sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
    return 301 __PATH__/;
}
location __PATH__/ {
    default_type text/html;
    return 200 '<!doctype html><html><head><meta charset="utf-8"><title>Resend</title><meta http-equiv="refresh" content="0; url=https://resend.com/"></head><body><p>Opening <a href="https://resend.com/">resend.com</a>…</p></body></html>';
}
