packaging_format = 2

id = "resend"
name = "Resend"
description.en = "Quicklink to Resend — the email API for developers (resend.com)."
description.fr = "Accès rapide à Resend — l'API e-mail pour développeurs (resend.com)."

version = "1.0~ynh1"

maintainers = ["quartztester"]

[upstream]
license = "Proprietary"
website = "https://resend.com"
code = "https://github.com/resend/resend-node"

[integration]
yunohost = ">= 11"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "10M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/resend"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
